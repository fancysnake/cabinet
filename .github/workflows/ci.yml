name: CI

on:
  pull_request:
  push:
    branches: ["main"]

concurrency:
  # The pull request's own number, so two of them sharing a branch name — two
  # forks both on `main` — cannot cancel each other. A push to a branch has no
  # pull request in its event, and the run id is unique, so nothing cancels it.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # The steps below run code the pull request itself supplies, so the
      # checkout token has no business staying behind in `.git/config`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # tingle measures the branch against main, so main has to be there.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      - run: mise settings experimental=true
      - run: mise install
      - run: poetry install
      - run: mise run lint:py
      - run: mise run lint:deptry
      # The same linters the pre-commit hook runs, over every file.
      - run: mise run lint:hk
      # Advisory: reports the branch's debt against main without blocking the
      # merge, so the number is seen every time and gated on nowhere yet.
      - run: mise run lint:tingle
        continue-on-error: true

  # The matrix comes from `requires-python`, so the range has one source.
  versions:
    runs-on: ubuntu-latest
    outputs:
      all: ${{ steps.range.outputs.all }}
      floor: ${{ steps.range.outputs.floor }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: range
        run: |
          spec=$(yq -p toml '.project.requires-python' pyproject.toml)
          spec=${spec//[[:space:]]/}
          if [[ ! $spec =~ ^\>=3\.([0-9]+),\<3\.([0-9]+)$ ]]; then
            echo "::error::requires-python must read >=3.X,<3.Y, got '$spec'"
            exit 1
          fi
          floor=${BASH_REMATCH[1]}
          ceiling=${BASH_REMATCH[2]}
          {
            echo "floor=3.$floor"
            echo "all=$(seq "$floor" $((ceiling - 1)) | jq -Rnc '[inputs | "3." + .]')"
          } >> "$GITHUB_OUTPUT"

  test:
    needs: versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.versions.outputs.all) }}
        include:
          # One report per commit is enough, so one leg carries the flag that
          # uploads it and the others only prove the suite passes on their
          # interpreter. Which leg it is lives here, not in the step's `if`.
          - python-version: ${{ needs.versions.outputs.floor }}
            coverage: true
    env:
      # Overrides the pin in mise.toml, so one config file serves every leg.
      MISE_PYTHON_VERSION: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # diff-cover on Codecov's side needs the base to compare against.
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@94c60b39bc2d90ab2f9bab27f38d3cc4812c1834 # v5
      - run: mise settings experimental=true
      - run: mise install
      - run: poetry install
      - run: mise run test:py:cov
      - run: mise exec -- coverage xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          disable_search: true
