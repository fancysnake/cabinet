---
name: Site

# `ci.yml` ignores `docs/**` and `mkdocs.yml`, so a documentation-only change
# runs none of the test matrix — and this is the workflow that change does run.
#
# `pyproject.toml` is in the list because it holds the `docs` dependency group,
# and `mise.toml` because it holds `site:build`: a site can break without a
# single page changing.
on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "mise.toml"
      - ".github/workflows/site.yml"

  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "pyproject.toml"
      - "mise.toml"
      - ".github/workflows/site.yml"

concurrency:
  group: site-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
      - run: mise install
      # Builds with `--strict`, so a link to a page that is not there fails
      # here rather than being published.
      - run: mise run site:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  # Pages has no per-pull-request preview, so a pull request builds and stops
  # there. The build is the review; the deploy waits for main.
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
