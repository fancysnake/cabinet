site_name: cabinet
site_url: https://cabinet.fancysnake.dev
site_description: Pull request maintenance rituals for GitHub and GitLab, and the Claude Code skills that keep a repository in order.
repo_url: https://github.com/fancysnake/cabinet
repo_name: fancysnake/cabinet
copyright: MIT

# A link to a page that is not there is what rots first when a page is renamed,
# and it fails `site:dev` as well as `site:build` from here.
strict: true

# Under strict a warning is a failure; anchors are how cross-references
# between pages actually break, and MkDocs only logs them at info.
validation:
  anchors: warn

theme:
  name: material
  logo: assets/logo.png
  favicon: assets/favicon.png
  # Both schemes are defined in `docs/stylesheets/tower.css`. No `primary` or
  # `accent` here on purpose: those generate their own rules, and two sources
  # for one colour is one more than the number that can be right.
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: tower
      toggle: {icon: material/candle, name: Up to the roof}
    - media: "(prefers-color-scheme: dark)"
      scheme: tower-night
      toggle: {icon: material/telescope, name: Back to the desk}
  features:
    - content.code.copy
    - navigation.top

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/fancysnake/cabinet
    - icon: fontawesome/solid/globe
      link: https://fancysnake.dev
      name: fancysnake.dev

extra_css:
  - stylesheets/tower.css

markdown_extensions:
  - toc: {permalink: true}
  # superfences needs it; no page asks for line numbers.
  - pymdownx.highlight
  - pymdownx.superfences
  # CHANGELOG.md is the one the release cuts; the page includes it from the
  # repo root, which is where mkdocs runs, so the two cannot drift.
  - pymdownx.snippets: {base_path: ["."], check_paths: true}

nav:
  - index.md
  - rituals.md
  - configuration.md
  - agents.md
  - plugins.md
  - architecture.md
  - changelog.md
