[tools]
actionlint = "1.7.12"
hk = "2.4.0"
pipx = "1.17.9"
"pipx:poetry" = "2.5.1"
pkl = "0.32.1"
python = "3.14.8"
# actionlint hands every `run:` script to shellcheck.
shellcheck = "0.11.0"

[hooks]
enter = ["poetry install", "hk install"]

[env]
# Mise creates and activates this virtualenv automatically
_.python.venv = { path = ".venv", create = true }
PACKAGE = "cabinet"
SRC_PATHS = "src"
TEST_PATHS = "tests"
SCRIPT_PATHS = ""
TOML_PATHS = ".taplo.toml .vekna.toml pyproject.toml mise.toml tingle.toml"

[task_config]
includes = ["git::https://github.com/fancysnake/shared-configs.git//python.toml"]

[tasks.update]
run = [
    "mise upgrade --bump --exclude python --minimum-release-age=7d",
    "mise install",
    { task = "dep:upgrade:py" },
]

[tasks."lint:deptry"]
description = "Find declared-but-unused and used-but-undeclared dependencies"
run = "deptry src tests"

# What the pre-commit hook runs on the staged files, run here over all of
# them. `hk install` (the enter hook) is what puts the git hook in place.
[tasks."lint:hk"]
description = "Run every hk linter on all files"
run = "hk check --all"

# `--only docs --no-root` because mkdocs.yml declares no plugins: nothing here
# imports `cabinet`, so neither the package nor the dev group is worth
# installing. `--only` alone still installs the root project.
[tasks."site:deps"]
description = "Install only what the documentation site needs"
run = "poetry install --only docs --no-root --quiet"

[tasks."site:dev"]
description = "Serve the documentation site with live reload"
run = [{ task = "site:deps" }, "mkdocs serve"]

[tasks."site:build"]
description = "Build the documentation site into site/"
run = [{ task = "site:deps" }, "mkdocs build"]

# `lint:py` comes from the shared config and cannot be appended to from here, so
# `lint:deptry` hangs off `fullcheck` instead — which is the gate that matters.
[tasks.fullcheck]
description = "The gate before a commit: format, lint, test with diff coverage"
run = [
    "poetry install",
    { task = "format:py" },
    { task = "lint:py" },
    { task = "lint:deptry" },
    { task = "lint:hk" },
    { task = "test:py:cov:diff" },
]

# `lint:tingle` (from the shared config) measures the branch's debt against
# main and is deliberately not in `fullcheck`: it is advisory in CI, and the
# first branch — this one — compares against a main that carries no tooling
# at all, so every ignore it introduces counts as growth. Run it by hand.
