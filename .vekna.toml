# This tome's own rituals, cast on itself: `vekna rituals show refresh` draws
# the graph from here, and the `[cabinet]` section is what the rituals read
# when they run over this repository's pull requests.
[rituals]
modules = ["cabinet.rituals"]

[cabinet]
forge = "github"
base = "main"
# The https twin of `origin`, with `gh` as the credential helper: a cast
# refuses an ssh remote before its first fetch. Both point at the same
# repository, so this is a route and not a destination.
remote = "https-origin"
gate = "mise run fullcheck"
# One suite, seconds long: the full measurement and the fast one are the same.
coverage = "mise run test:py:cov:diff"
fast_coverage = "mise run test:py:cov:diff"
sign_commits = true
# Installed from this repository's own marketplace, so named with their
# plugin's prefix.
identify_skill = "issues:issues"
stories_skill = "lean-stories:lean-stories"

[cabinet.labels]
reviewed = "pr::thermo"
wait = "pr::wait"
qa = "v:guide:done"
marker = "v"

# The job names in .github/workflows/ci.yml, plus what Codecov posts.
[cabinet.ci.jobs.checks]
[cabinet.ci.jobs.test]
[cabinet.ci.jobs."codecov/patch"]
covering = true

[cabinet.agent]
model = "opus"
effort = "high"
max_turns = 0
# The whole-repository linter sweeps, which the gate runs anyway. One linter
# over one file, or one test file or case, stays a quick check.
may_not_run = ["mise run lint:py", "mise run lint:hk"]
